[project]
name = "code-analysis"
version = "0.1.0"
description = "Tools for analyzing code."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.3.1",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
